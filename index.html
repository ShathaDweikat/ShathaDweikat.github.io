<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shatha Dweikat | Research • Strategy • Sustainability</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cairo:wght@400;500;700&display=swap" rel="stylesheet">

<style>

:root{
--cream:#F7F1E7;
--emerald:#0F766E;
--mint:#B8E3D1;
--dark:#222;
--white:#fff;
--shadow:0 15px 35px rgba(0,0,0,.08);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:var(--cream);
color:var(--dark);
font-family:"Inter","Cairo",sans-serif;
line-height:1.7;
}

html{
scroll-behavior:smooth;
}

.container{
width:90%;
max-width:1150px;
margin:auto;
}

section{
padding:70px 0;
}


/* COVER */

.cover-section{
padding:0;
text-align:center;
}

.cover{

width:100%;
height:450px;
object-fit:contain;
display:block;
background:var(--cream);

}



/* NAME AREA */

.brand{

padding:35px 0;

}


.profile-brand{

display:flex;
align-items:center;
justify-content:center;
gap:30px;

}


.profile-brand img{

width:120px;
height:120px;
object-fit:cover;
border-radius:50%;
border:5px solid white;
box-shadow:var(--shadow);

}


.brand-text h1{

font-size:3.5rem;
line-height:1.1;

}


.brand-text h1 span{

color:var(--emerald);

}


.arabic-name{

font-family:"Cairo";
font-size:1.8rem;
color:#555;

}


.tagline{

color:var(--emerald);
font-weight:600;
font-size:1.1rem;

}



/* TITLES */

.section-title{

text-align:center;
margin-bottom:40px;

}


.section-title h2{

font-size:2.5rem;

}


.section-title p{

color:#666;

}



/* ABOUT */

.about{

display:block;

}


.card{

background:white;
padding:40px;
border-radius:25px;
box-shadow:var(--shadow);

}


.card h3{

color:var(--emerald);
margin-bottom:20px;

}
  <!-- RESEARCH -->

<section id="research">

<div class="container">

<div class="section-title">

<h2>Research</h2>

<p>Academic interests and focus areas</p>

</div>


<div class="cards">


<div class="small-card">

<h3>CSR</h3>

<p>
Corporate Social Responsibility and sustainable value creation.
</p>

</div>


<div class="small-card">

<h3>Sustainability</h3>

<p>
Sustainable development strategies and long-term impact.
</p>

</div>


<div class="small-card">

<h3>Social Impact</h3>

<p>
Empowerment, community development and human potential.
</p>

</div>


</div>

</div>

</section>



<!-- COURSES -->

<section id="courses">

<div class="container">

<div class="section-title">

<h2>Learning Hub</h2>

<p>Free courses and educational resources</p>

</div>


<div class="course">


<span class="badge">
Free Course
</span>


<h2>
رحلة التغيير | Journey of Change
</h2>


<p>
An educational journey designed to support awareness, growth and meaningful transformation.
</p>


<a href="#" class="button">
Start Learning
</a>


</div>

</div>

</section>



<!-- INITIATIVE -->

<section id="initiatives">

<div class="container">

<div class="section-title">

<h2>Social Impact Initiatives</h2>

<p>
Ideas for future implementation
</p>

</div>


<div class="card">


<h3>
خطوة 19 | Step 19
</h3>


<p>
A proposed initiative designed to support and empower orphaned girls through education, personal development and opportunities.
</p>


<span class="badge">
Concept Development
</span>


</div>

</div>

</section>
  <!-- PUBLICATIONS -->

<section id="publications">

<div class="container">

<div class="section-title">

<h2>Publications</h2>

<p>
Research papers and academic contributions
</p>

</div>


<div class="card">

<h3>
Coming Soon
</h3>

<p>
Future publications and research work will be added here.
</p>

</div>


</div>

</section>



<!-- CONTACT -->

<section id="contact">

<div class="container">

<div class="card">


<h3>
Let's Connect
</h3>


<p>
Research collaborations, projects and learning initiatives.
</p>


<a href="#" class="button">
Contact Me
</a>


</div>

</div>

</section>



</main>



<footer>

<p>
© 2026 Shatha Dweikat. All Rights Reserved.
</p>

</footer>



<style>

.cards{

display:grid;
grid-template-columns:repeat(3,1fr);
gap:25px;

}


.small-card{

background:white;
padding:30px;
border-radius:25px;
box-shadow:var(--shadow);

transition:.3s;

}


.small-card:hover{

transform:translateY(-7px);

}


.course{

background:rgba(184,227,209,.25);
padding:40px;
border-radius:30px;

}


.badge{

display:inline-block;
background:var(--mint);
color:var(--emerald);
padding:7px 18px;
border-radius:30px;
margin-bottom:15px;

}


.button{

display:inline-block;
margin-top:20px;
background:var(--emerald);
color:white;
padding:12px 30px;
border-radius:50px;
text-decoration:none;

}



@media(max-width:900px){

.profile-brand{

flex-direction:column;
text-align:center;

}


.brand-text h1{

font-size:2.7rem;

}


.cards{

grid-template-columns:1fr;

}


.cover{

height:280px;

}

}


</style>


</body>

</html>
